          for old, new in [
              ('<p class="lede">Indexing is the strongest single signal a researcher can check — but it is a status a journal holds today, not a character certificate it keeps forever. Understanding that difference is what keeps you safe.</p>', '<p class="lede">Current indexing is a useful, independently checkable signal — not a character certificate or guarantee. Understanding what coverage does and does not show reduces the risk of relying on a stale badge.</p>'),
              ('it remains the single most useful check you can run', 'it remains one of the most useful checks you can run'),
              ('Only the second one protects you.', 'The current-status question is the relevant one for a new decision.'),
              ('Getting into a major index is genuinely difficult, but the system is not immune to gaming.', 'Published selection and re-evaluation processes reduce risk but cannot eliminate every later change in journal conduct.'),
              ('The reassuring half of the story is that the indexes actively police themselves.', 'The useful feature is that the indexes publish selection and re-evaluation processes and can discontinue coverage.'),
              ('This ongoing housekeeping is exactly why the index is trustworthy; it is also exactly why a one-time check is not enough.', 'This re-evaluation is why current status should be checked rather than inferred from a historical badge.'),
              ('<p>The check takes two minutes and settles the matter.', '<p>The check can usually be completed quickly and clarifies the current coverage record.'),
              ('a stale or fabricated "indexed in Scopus" badge is worth nothing; the live record is worth everything.', 'a stale or fabricated badge is not evidence; the current source record should take precedence.'),
              ('Indexing is the best signal we have — I trust it precisely because the indexes are willing to remove journals — but I trust the <em>current</em> record, never the badge and never my memory.', 'Indexing is one signal I check because current records can be independently verified and coverage can be re-evaluated. I rely on the current record rather than a badge or memory, and I still assess identity, provenance and conduct separately.'),
              ('<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · 11 July 2026 · 8 min read</p>', '<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · Updated 4 August 2026 · 8 min read</p>'),
              ('<p class="src">Sources and further reading: the Scopus sources page and the freely downloadable Scopus source list, including its discontinued-titles information (Elsevier); the Web of Science Master Journal List (Clarivate); and Think. Check. Submit. Method and definitions are drawn from these public sources and, where noted, from the author\'s own peer-review practice across Scopus and Web of Science journals. Compiled with care; verify any decisive detail at the primary source on the day you act.</p>', '<p class="src">Verification sources: <a href="https://www.scopus.com/sources" rel="noopener">Scopus Sources</a> and <a href="https://www.elsevier.com/products/scopus/content/content-policy-and-selection" rel="noopener">Scopus content policy and re-evaluation information</a>; the <a href="https://mjl.clarivate.com/home" rel="noopener">Web of Science Master Journal List</a>; and <a href="https://thinkchecksubmit.org/" rel="noopener">Think. Check. Submit.</a> Accessed 4 August 2026. Current coverage is one signal and should be considered with identity, provenance, conduct and institutional requirements.</p>'),
