          # NAAC pillar guide: distinguish live basic portal from evolving MBGL details.
          path = 'insights/naac-2025-reforms/index.html'
          for old, new in [
              ('<p class="lede">The familiar A++ to C grade is being retired. In its place: a binary Accredited-or-not decision, and a maturity-level system still settling into place. Here is what has actually changed, how the assessment now works, and what an IQAC should be doing about it — with the parts that are still provisional flagged as such.</p>', '<p class="lede">NAAC is transitioning away from the familiar A++ to C model. A basic-accreditation portal is live, while maturity-based levels and cycle-specific procedures remain subject to current official manuals. This guide separates the published direction from details that are still provisional.</p>'),
              ('has moved away from the graded letter system toward a <strong>binary</strong> model', 'is transitioning from the graded letter system toward a <strong>binary</strong> model'),
              ('<p>The first and most concrete change is the move to a <strong>binary outcome</strong>. Instead of a spread of grades from A++ down to C, the assessment now yields one of two results: an institution is <strong>Accredited</strong> or <strong>Not Accredited</strong>. The point is to establish a clear, defensible quality threshold — a floor that certifies an institution meets the standards expected of it, without pretending to rank every institution on a single fine-grained scale. For an institution, the practical consequence is a change of mindset: the question is no longer "how do we push our CGPA up by a decimal?" but "do we clearly clear the bar, on evidence that will withstand verification?"</p>', '<p>The published reform direction uses a binary basic-accreditation outcome rather than treating a fine-grained letter grade as the only public result. NAAC’s basic-accreditation portal is live, but the rule applying to a particular institution depends on its cycle, eligibility and the current official manual. IQAC teams should therefore prepare evidence for a threshold decision while confirming the exact process before submission.</p>'),
              ('<h2 id="process">The process: IIQA, SSR, DCF, DVV</h2>', '<h2 id="process">Evidence workflows: verify the current cycle</h2>'),
              ('<p>The assessment machinery is where IQAC teams spend their time, and the acronyms matter. The <strong>IIQA (Institutional Information for Quality Assessment)</strong> is the eligibility gateway an institution clears to enter the cycle. The <strong>SSR (Self-Study Report)</strong> is the institution\'s substantive account of itself. Quantitative data flows through the <strong>DCF (Data Capturing Format)</strong>, and — critically under the reformed, integrity-focused process — that data is then subjected to <strong>DVV (Data Validation and Verification)</strong>, where the numbers an institution reports are cross-checked against the evidence it can actually produce. The single most important shift for an IQAC is that <strong>unverifiable claims are now a liability, not a shortcut</strong>: every figure entered should be traceable to a document that survives validation.</p>', '<p>IIQA, SSR, DCF and DVV are familiar terms from NAAC’s graded accreditation workflows, but IQAC teams should not assume that every legacy sequence transfers unchanged to binary basic accreditation or future MBGL cycles. Confirm the current manual and portal instructions for the institution’s route. The durable requirement is evidence integrity: every submitted figure should be traceable to a dated source and reconciled with other official records.</p>'),
              ('<p>NAAC has moved away from the letter-grade and CGPA system (A++ to C) to a binary outcome — an institution is either Accredited or Not Accredited. A second stage, Maturity-Based Graded Levels, is designed to place accredited institutions on a scale of maturity levels rather than a single letter grade.</p>', '<p>NAAC is implementing a transition from the letter-grade and CGPA model toward binary basic accreditation. A maturity-based framework is part of the published reform direction, but institutions should verify the cycle-specific manual and current portal before treating any secondary summary as operational instruction.</p>'),
              ('<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · 12 July 2026 · 12 min read</p>', '<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · Updated 4 August 2026 · 12 min read</p>'),
              ('<p class="src">Sources and further reading: NAAC\'s own communications and manuals on the revised accreditation framework, the binary accreditation model and Maturity-Based Graded Levels (naac.gov.in); the report of the expert committee on accreditation reform that recommended the shift; and UGC communications on quality assurance. Because the MBGL benchmarks and manuals have been evolving, treat exact level definitions as provisional and confirm them against NAAC\'s current official documentation. Compiled with care; verify any decisive detail at the primary source on the day you act.</p>', '<p class="src">Current official sources: the <a href="https://assessmentonline-basic.naac.gov.in/" rel="noopener">NAAC Basic Accreditation Portal</a>, <a href="https://www.naac.gov.in/" rel="noopener">NAAC</a>, and the Ministry of Education’s <a href="https://www.education.gov.in/nep/aqeg-he" rel="noopener">higher-education quality and accreditation reform material</a>. Accessed 4 August 2026. The basic portal is live; MBGL definitions, transition arrangements and cycle-specific procedures must be confirmed against the current official manual before an institution acts.</p>'),
          ]:
              replace_once(path, old, new)

          # Short NAAC briefing: remove presentation of provisional mechanics as settled facts.
          path = 'insights/naac-binary-mbgl-2026/index.html'
          for old, new in [
              ('"dateModified":"2026-07-07"', '"dateModified":"2026-08-04"'),
              ('"description":"NAAC replaced the A++ to C grade with binary accreditation and Maturity-Based Graded Levels in 2025. A practical guide for IQAC coordinators on what actually changes and how to prepare."', '"description":"NAAC is transitioning from letter-grade accreditation toward binary basic accreditation, while maturity-level and data-verification details remain subject to current official manuals."'),
              ('<p class="lede">The familiar A++ to C grade is being retired. In its place: a pass/fail binary accreditation and a five-level maturity ladder, cross-checked by AI against government databases. For IQAC teams, the preparation that used to work no longer maps to the target.</p>', '<p class="lede">NAAC is transitioning from letter grades toward binary basic accreditation. The basic portal is live, while maturity-level design and technology-supported verification details remain subject to current official manuals. IQAC preparation should therefore focus on evidence integrity without assuming every proposed feature is already operational.</p>'),
              ('<p>On 10 February 2025, following recommendations from a high-level committee chaired by the former ISRO chairman Dr. K. Radhakrishnan, NAAC announced the most significant overhaul of Indian higher-education accreditation in a generation. The single cumulative grade point average that institutions have chased for years — the A++, the A+, the anxious difference between a 3.26 and a 3.51 — is being replaced by a two-part structure. If your IQAC is still preparing the way it did in 2023, it is optimising for a target that no longer exists. For the full picture — the assessment process, the research angle and a readiness checklist — see our complete <a href="../naac-2025-reforms/">NAAC 2025 reforms guide for IQAC teams</a>.</p>', '<p>Following the recommendations of the committee chaired by Dr. K. Radhakrishnan, India’s accreditation reform direction includes broader coverage, binary basic accreditation and a maturity-based framework. Implementation is phased. A live basic-accreditation portal confirms operational movement, but an institution must check its current cycle and manual before assuming that the earlier graded route no longer applies. For the fuller evidence-readiness discussion, see our <a href="../naac-2025-reforms/">NAAC reforms guide for IQAC teams</a>.</p>'),
              ('<p>The new architecture has two tiers, and it helps to keep them separate in your mind. The first is the Binary Accreditation Framework: a simple Accredited or Not Accredited outcome, determined largely through AI-supported verification of the documents and data an institution submits. This is a threshold, not a ranking. It answers one question — does this institution meet the baseline to be a recognised, quality-assured higher-education provider — and it answers it yes or no. The intent is to bring the large majority of India\'s institutions, many of which never engaged with the old graded system at all, across that line; NAAC has spoken of accrediting more than ninety percent of the country\'s institutions under the new model within five years.</p>', '<p>The reform direction separates a binary basic-accreditation threshold from later maturity-based differentiation. The live basic portal supports an Accredited / Not Accredited model, but the assessment method and evidence requirements must be read from the current official manual. Ministry of Education material describes expanding accreditation coverage and a gradual shift toward binary accreditation; it does not justify treating every proposed implementation detail as settled.</p>'),
              ('<p>The second tier is where differentiation moves. Maturity-Based Graded Levels, or MBGL, is a five-level ladder — Level 1 Basic, Level 2 Developing, Level 3 Established, Level 4 Advanced, and Level 5 Global Excellence — assessing how mature an institution\'s systems are across governance, teaching and learning, research, and infrastructure. An institution first clears the binary threshold, then, if it chooses, works its way up the maturity levels. The top rung is explicitly benchmarked against international standards, which reframes what "excellence" is being measured against.</p>', '<p>Maturity-Based Graded Levels are intended to provide developmental differentiation beyond a binary threshold. Secondary materials commonly describe five levels, but exact labels, sequencing, eligibility and benchmarks should be treated as provisional until confirmed in the current NAAC manual. IQAC teams can plan for evidence maturity without presenting a secondary summary as the operative rule.</p>'),
              ('<p>The reform that most alters day-to-day IQAC work is not the grading structure at all — it is the verification method. NAAC is moving to an AI-driven system, underpinned by a One Nation One Data Platform that cross-verifies an institution\'s claims against government databases including AISHE and NIRF. In the older regime, a well-crafted self-study report and a persuasive peer-team visit could carry an institution some distance. In the new one, the numbers you submit will be checked, automatically, against the numbers you have already reported elsewhere. Inconsistency between your NAAC submission and your AISHE filing is no longer a low-probability audit risk; it is the default check.</p>', '<p>Official reform discussions emphasise greater technology-supported verification and better integration of higher-education data. The exact role of AI, the One Nation One Data architecture and automated cross-checking against AISHE or NIRF must be confirmed from current operational documentation. Even where a particular automated check is not yet live, reconciling institutional figures across official submissions is sound evidence governance.</p>'),
              ('because the platform will read them together.', 'because official systems may compare or reuse related records.'),
              ('under AI cross-verification, easiest to expose.', 'under stronger data verification, easier to challenge.'),
              ('<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · 7 July 2026 · 6 min read</p>', '<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · Updated 4 August 2026 · 6 min read</p>'),
              ('<p class="src">Sources: NAAC reform announcement of 10 February 2025 and the recommendations of the committee chaired by Dr. K. Radhakrishnan; NAAC materials on the Binary Accreditation Framework, Maturity-Based Graded Levels and the One Nation One Data Platform. Institutions should confirm current procedural details against official NAAC notifications, which continue to evolve as the framework rolls out.</p>', '<p class="src">Current official sources: the <a href="https://assessmentonline-basic.naac.gov.in/" rel="noopener">NAAC Basic Accreditation Portal</a>, <a href="https://www.naac.gov.in/" rel="noopener">NAAC</a>, and the Ministry of Education’s <a href="https://www.education.gov.in/nep/aqeg-he" rel="noopener">quality and accreditation reform material</a>. Accessed 4 August 2026. Institutions must confirm their current cycle, manual, portal and transition arrangements before acting on binary or MBGL details.</p>'),
          ]:
