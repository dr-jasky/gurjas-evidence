name: Apply GJ-003 insight audit

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/remaining-insight-audit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remaining-insight-audit
          fetch-depth: 0

      - name: Apply audited corrections and registry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def replace_once(path, old, new):
              p = root / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def replace_all(path, old, new, minimum=1):
              p = root / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} matches, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Discovery-page representations must be as careful as the articles they describe.
          index = 'insights/index.html'
          replacements = [
              ('<h3>DOAJ, COPE and OASPA: what each membership actually guarantees</h3>', '<h3>DOAJ, COPE and OASPA: what each signal does — and does not — show</h3>'),
              ('<p>Journals wear these badges as proof of safety. What each one really certifies, its limits, and how to verify it at the source.</p>', '<p>Journals display these badges as reassurance. What each signal supports, its limits, and how to verify the underlying record at the source.</p>'),
              ("<p>A hijacked journal steals a real journal's identity, which is why ordinary checks miss it. The five checks that expose a clone in two minutes.</p>", "<p>A hijacked journal steals a real journal's identity, which is why ordinary checks can miss it. Five checks can reveal an impersonating site and identify unresolved identity gaps.</p>"),
              ('<p>Predatory journals buy official-sounding "impact factors." The two metrics the research world recognises, and a one-line test to expose a fake.</p>', '<p>Some deceptive journals display official-sounding metrics. Learn how to trace widely used citation metrics to their source and identify unverified marketing numbers.</p>'),
              ('<p>What replaced the list, what the frozen 1,474-journal list means, who decides now, and how to choose a journal safely under the new UGC Suggestive Parameters.</p>', '<p>What replaced the list, what the frozen 1,474-journal list means, who decides now, and how to choose a journal under the new UGC Suggestive Parameters.</p>'),
              ('<p>Why lists were always fragile, and the three free checks that replace the UGC-CARE lookup and actually settle the question.</p>', '<p>Why lists are fragile, and three free checks that replace a single-list lookup and support a documented decision.</p>'),
              ('<p style="max-width:52em;color:var(--muted);margin:.7rem 0 1.7rem">In the post-CARE landscape, genuine Scopus indexing is the benchmark that matters. How to choose, verify, cost and time a submission — honestly.</p>', '<p style="max-width:52em;color:var(--muted);margin:.7rem 0 1.7rem">In the post-CARE landscape, current Scopus coverage is one widely used, independently checkable signal. How to choose, verify, cost and time a submission — honestly.</p>'),
              ('<p>The A++ to C grade is retired. A practical guide to the new pass/fail accreditation, the five maturity levels, and AI data cross-verification.</p>', '<p>NAAC is transitioning from letter grades toward binary accreditation and maturity-based levels. A cautious guide to the published direction, provisional details and evidence-readiness implications.</p>'),
          ]
          for old, new in replacements:
              replace_once(index, old, new)

          # DOAJ / COPE / OASPA.
          path = 'insights/doaj-cope-oaspa-memberships/index.html'
          for old, new in [
              ('<h1>DOAJ, COPE and OASPA: what each membership actually guarantees</h1>', '<h1>DOAJ, COPE and OASPA: what each signal does — and does not — show</h1>'),
              ('<p class="lede">Three names appear on journal homepages as reassurance — DOAJ, COPE, OASPA — and researchers treat all three as a stamp of safety. They are useful signals, but they certify different things, and a predatory journal will happily display a badge it never earned. Here is what each actually means.</p>', '<p class="lede">Three names appear on journal homepages as reassurance — DOAJ, COPE and OASPA. They can be useful signals, but each supports a different inference, none is a warranty of journal quality, and every claimed badge must be checked against the organisation’s own record.</p>'),
              ('what each one certifies before you trust it.', 'what evidence each one can support before you rely on it.'),
              ("<p>The <strong>Open Access Scholarly Publishing Association (OASPA)</strong> represents open-access publishers and applies membership criteria intended to reflect responsible open-access practice. For a publisher, OASPA membership is a signal of adherence to those standards. As with COPE, it certifies the publisher's commitments rather than any individual article, and — again as with COPE — the way to trust it is to confirm the publisher on OASPA's own member listing rather than believing a badge on the journal's site.</p>", "<p>The <strong>Open Access Scholarly Publishing Association (OASPA)</strong> represents open-access publishers and applies published membership criteria. A current listing is evidence that the publisher met those criteria at the time of verification; it is not certification of every journal, article or editorial decision. Confirm the publisher on OASPA's own member directory rather than relying on a badge displayed by the journal.</p>"),
              ("<p>Notice the common thread: each of these is a positive signal about a journal's <em>process and commitments</em>, none is a guarantee of article quality, and every one of them should be verified at the source rather than trusted as a logo. A predatory journal can paste any of these badges onto its homepage in minutes; what it cannot do is appear in DOAJ's index, COPE's member list or OASPA's member directory when you go and look. So the habit is simple — for any membership a journal claims, open that organisation's own directory and confirm the journal is actually there. A badge you can verify is reassurance; a badge you cannot is a red flag.</p>", "<p>Notice the common thread: each is a positive signal about process, participation or transparency; none guarantees article quality or conduct in a particular case. A false or stale badge claim can be tested by checking the relevant organisation's own directory. Record what the official source shows, the date checked and any identity mismatch. A verified current record supports further consideration; an unverified claim is a stop-and-check condition, not by itself a final verdict.</p>"),
              ('<h3>What does COPE membership prove?</h3>', '<h3>What does COPE membership indicate?</h3>'),
              ("<p>COPE membership means a journal or publisher has committed to the Committee on Publication Ethics' code of conduct and best-practice guidelines for handling misconduct, corrections and retractions. It certifies a commitment to ethical process, not the quality of any single article, and it can be verified on COPE's own member list.</p>", "<p>COPE membership indicates participation in the organisation and access to its publication-ethics guidance. It does not independently certify every editorial practice or the quality of an individual article. Confirm the current member record and assess the journal's actual policies and conduct separately.</p>"),
              ('<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · 12 July 2026 · 8 min read</p>', '<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · Updated 4 August 2026 · 8 min read</p>'),
              ('<p class="src">Sources and further reading: the Directory of Open Access Journals (DOAJ) and its inclusion criteria; the Committee on Publication Ethics (COPE) code of conduct and member directory; the Open Access Scholarly Publishing Association (OASPA) membership criteria and member list; and Think. Check. Submit. Definitions are drawn from these public sources and, where noted, from the author\'s own peer-review practice. Compiled with care; verify any claimed membership at the organisation\'s own directory.</p>', '<p class="src">Verification sources: <a href="https://doaj.org/apply/guide/" rel="noopener">DOAJ application guide</a>; <a href="https://publicationethics.org/members" rel="noopener">COPE member directory</a> and <a href="https://publicationethics.org/resources/guidelines-new/principles-transparency-and-best-practice-scholarly-publishing" rel="noopener">Principles of Transparency and Best Practice</a>; <a href="https://www.oaspa.org/membership/current-members/" rel="noopener">OASPA current members</a>; and <a href="https://thinkchecksubmit.org/" rel="noopener">Think. Check. Submit.</a> Accessed 4 August 2026. Membership and directory status can change; verify the current record on the day you act.</p>'),
          ]:
              replace_once(path, old, new)

          # Cloned journals.
          path = 'insights/cloned-hijacked-journals/index.html'
          for old, new in [
              ('<p class="lede">A hijacked journal does not invent a fake reputation — it steals a real one. That is what makes it the hardest scam in scholarly publishing to catch, and the one where a two-minute habit protects you completely.</p>', '<p class="lede">A hijacked journal does not invent a reputation — it steals a real journal’s identity. That makes impersonation difficult to detect, but a disciplined comparison of the website, publisher record and identifiers can materially reduce the risk.</p>'),
              ('<strong>verifying a journal\'s name and number tells you nothing about whether the site in your inbox is the real one</strong>', '<strong>verifying a journal\'s name and number does not establish that the website in your inbox belongs to the publisher of record</strong>'),
              ('<p><strong>2. Compare the web address, character by character.</strong> Place the address of record beside the address that solicited you and read them slowly. Clones differ in small, deliberate ways: an added or dropped word, a different country suffix, a hyphen, a <code>.org</code> where the original is <code>.com</code>. A difference of a single character is a decisive finding, not a coincidence.</p>', '<p><strong>2. Compare the web address, character by character.</strong> Place the address of record beside the address that solicited you and read them slowly. Impersonating sites may differ through an added or dropped word, a country suffix, a hyphen or another domain variation. Any unexplained mismatch is a stop-and-verify condition; document it and confirm the publisher address through an authoritative record.</p>'),
              ('<p><strong>3. Resolve recent DOIs.</strong> Take two or three recent articles from the site you were sent to and click their DOIs. A genuine DOI begins with <code>10.</code> and resolves, through Crossref, to the article at the publisher of record. If the DOIs do not resolve, or resolve to a different site, you are on a clone.</p>', '<p><strong>3. Resolve recent persistent identifiers.</strong> Test two or three recent DOI links from the site. A DOI may be registered through Crossref or another registration agency and should resolve to the expected article record. Non-resolution or a publisher mismatch is a material identity concern that requires investigation; it does not, by itself, prove that the site is a clone.</p>'),
              ('<p><strong>5. Check the register.</strong> Look the title up in the Retraction Watch Hijacked Journal Checker, which exists specifically to document known impersonations. A listing there is confirmation; an absence is not a clearance, because new clones appear faster than any register can add them.</p>', '<p><strong>5. Check the register.</strong> Look the title up in the Retraction Watch Hijacked Journal Checker, which documents reported impersonations and publishes its methods. A listing is evidence of a documented concern requiring verification; absence is not clearance, because any register can be incomplete or delayed.</p>'),
              ("The clone's whole advantage is a moment of misplaced trust; once you know to check the address of record, that advantage disappears.", "The clone's advantage depends on misplaced trust; checking the address of record and preserving the evidence materially reduces that advantage."),
              ('<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · 11 July 2026 · 8 min read</p>', '<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · Updated 4 August 2026 · 8 min read</p>'),
              ('<p class="src">Sources and further reading: the Retraction Watch Hijacked Journal Checker; scholarship on journal hijacking in the research-integrity literature; the Scopus source list (Elsevier) and the Web of Science Master Journal List (Clarivate); Crossref DOI resolution; and Think. Check. Submit. Figures and dates are drawn from these public sources and, where noted, from the author\'s own peer-review practice. Compiled with care; confirm any decisive detail at the primary source on the day you act.</p>', '<p class="src">Verification sources: the <a href="https://retractionwatch.com/the-retraction-watch-hijacked-journal-checker/" rel="noopener">Retraction Watch Hijacked Journal Checker</a> and its <a href="https://retractionwatch.com/the-retraction-watch-hijacked-journal-checker/methods/" rel="noopener">published methods</a>; <a href="https://www.elsevier.com/products/scopus/content/content-policy-and-selection" rel="noopener">Scopus content policy</a>; the <a href="https://mjl.clarivate.com/home" rel="noopener">Web of Science Master Journal List</a>; <a href="https://www.crossref.org/documentation/register-maintain-records/verify-your-registration/" rel="noopener">Crossref registration verification</a>; and <a href="https://thinkchecksubmit.org/" rel="noopener">Think. Check. Submit.</a> Accessed 4 August 2026. Confirm any decisive identity detail at the relevant primary source on the day you act.</p>'),
          ]:
              replace_once(path, old, new)

          # Fake metrics.
          path = 'insights/fake-impact-factors/index.html'
          for old, new in [
              ('<p class="lede">A predatory journal cannot buy a genuine reputation, so it buys a number that looks like one. Learn the two metrics the research world actually recognises, and you can spot a manufactured "impact factor" in a single step.</p>', '<p class="lede">Some deceptive journals display official-sounding metrics that cannot be traced to a transparent, independently governed source. Learn how to verify widely used journal metrics and separate recognised records from unverified marketing claims.</p>'),
              ('Open the homepage of almost any predatory journal', 'Open the homepage of many questionable journals'),
              ('The problem is that most of these numbers measure nothing.', 'The problem is that many of these numbers are not independently verifiable or methodologically transparent.'),
              ('This guide, a companion to our <a href="../how-to-identify-a-predatory-journal/">complete guide to identifying a predatory or cloned journal</a>, explains which journal metrics carry real weight, how the fakes are manufactured, and the single check that separates the two.', 'This guide, a companion to our <a href="../how-to-identify-a-predatory-journal/">complete guide to identifying a predatory or cloned journal</a>, explains widely used journal metrics, how questionable metrics are marketed, and a source-tracing check that separates recognised records from unverified claims.'),
              ('Only a small number of journal-level metrics are produced by the organisations that actually run the major citation indexes, and this is what gives them their authority.', 'Several widely used journal-level metrics are produced from major citation databases under published methodologies; their provenance and method are what make them independently checkable.'),
              ('The common thread is decisive: a real journal metric is produced <em>by the index</em>, not sold <em>to the journal</em>.', 'The useful distinction is provenance: verify who calculates the metric, which data it uses, whether the method is published and whether the value appears in the source organisation’s own record.'),
              ('Some of these outfits list hundreds or thousands of journals; none of them runs a genuine, selective citation index, which is the only thing that would make the number mean anything.', 'Some services list large numbers of journals, but their authority cannot be assumed unless the methodology, data source and governance can be independently checked.'),
              ('A fake metric is a confession.', 'An unverified metric is a material warning signal.'),
              ('<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · 11 July 2026 · 8 min read</p>', '<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · Updated 4 August 2026 · 8 min read</p>'),
              ('<p class="src">Sources and further reading: Clarivate Journal Citation Reports and the Web of Science Master Journal List (Journal Impact Factor); Elsevier / Scopus (CiteScore); SCImago Journal Rank (SJR) and Source Normalized Impact per Paper (SNIP); and Think. Check. Submit. Method and definitions are drawn from these public sources and, where noted, from the author\'s own peer-review practice. Compiled with care; verify any decisive detail at the primary source on the day you act.</p>', '<p class="src">Verification sources: <a href="https://clarivate.com/academia-government/scientific-and-academic-research/research-funding-analytics/journal-citation-reports/" rel="noopener">Clarivate Journal Citation Reports</a> and the <a href="https://mjl.clarivate.com/home" rel="noopener">Web of Science Master Journal List</a>; <a href="https://www.elsevier.com/en-gb/products/scopus/metrics/citescore" rel="noopener">Elsevier CiteScore documentation</a>; <a href="https://www.scimagojr.com/" rel="noopener">SCImago Journal Rank</a>; and <a href="https://thinkchecksubmit.org/" rel="noopener">Think. Check. Submit.</a> Accessed 4 August 2026. Verify the metric, year, category and source before relying on a journal-level number.</p>'),
          ]:
              replace_once(path, old, new)

          # Recovery guidance: reduce legal and integrity overstatement.
          path = 'insights/published-in-predatory-journal-what-to-do/index.html'
          for old, new in [
              ('<p>An important reassurance: a disreputable venue does not erase your authorship. You remain the author of your work, and in many cases you retain more rights over it than you assume, particularly where you never signed a valid exclusive transfer or where the "agreement" itself is part of a fraudulent operation. The intellectual contribution is yours. That matters, because it shapes the realistic goal — which is usually to correct the record and, where possible, free the work to be properly published or properly retired, rather than to pretend it never happened.</p>', '<p>A disreputable venue does not erase the fact that you created the work, but copyright, licence and republication rights depend on the agreement, applicable law and the status of the first publication. Do not assume that a questionable publisher’s conduct automatically restores every right. Preserve the submission and licence records, ask the institution’s research-integrity office for guidance and obtain qualified legal advice where ownership or reuse is disputed.</p>'),
              ('<p>Here is the error that turns a recoverable situation into a genuine integrity problem: quietly submitting the same paper to a legitimate journal <em>while it still stands published</em> in the predatory one. That is duplicate publication, and if it is discovered — increasingly likely as similarity-checking tools improve — it can trigger a retraction and a misconduct finding at the good journal, which is far worse than the original mistake. The same paper may not be under consideration or published in two places at once. Any move to republish must come <strong>after</strong> the first version is properly withdrawn or retracted, and should be disclosed to the new editor rather than hidden. Fix the first problem before you create a second.</p>', '<p>Submitting substantially the same manuscript elsewhere while an earlier version remains published can create duplicate-publication and copyright concerns. Journal policies, legal rights and available remedies vary, especially when a questionable outlet refuses withdrawal. Do not resubmit quietly. First document the status of the existing version, seek institutional guidance and disclose the full history to any prospective editor; obtain qualified advice where withdrawal, retraction or rights remain contested.</p>'),
              ('<p>Counter-intuitively, the safest move is often the most transparent one: raise it yourself, early, with your supervisor or your institution\'s research-integrity or ethics office, before anyone else raises it for you. Coming forward reframes the story from something concealed to something responsibly handled, which is how reasonable committees treat it. In the Indian context, remember the ground has shifted: with the UGC-CARE list discontinued in 2025 and journal selection now devolved to institutions under the new Suggestive Parameters, your university sets its own view of what counts — so an early, honest conversation is also how you find out where you actually stand under the current rules rather than the old list.</p>', '<p>An early, documented disclosure to your supervisor or institution’s research-integrity or ethics office is often the most defensible first step. It can demonstrate responsible handling, but the institutional outcome depends on the applicable policy and facts. In India, the discontinuation of the UGC-CARE list makes the institution’s current written rule especially important, so ask for that rule and preserve the response.</p>'),
              ('One predatory paper, handled openly, is a footnote. The habit that produced it is the thing to change.', 'A documented, transparent response is more defensible than concealment. The practical priority is to correct the record where possible and change the verification process used for future submissions.'),
              ('<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · 11 July 2026 · 8 min read</p>', '<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · Updated 4 August 2026 · 8 min read</p>'),
              ('<p class="src">Sources and further reading: Committee on Publication Ethics (COPE) guidance on retractions and duplicate publication; the Retraction Watch Hijacked Journal Checker; the UGC notice discontinuing the CARE list (effective 11 February 2025) and the Suggestive Parameters for Peer-Reviewed Journals (notified 16 July 2025); and Think. Check. Submit. This article is general information, not legal advice; where the stakes are high, consult your institution\'s research-integrity office and, if appropriate, a qualified professional.</p>', '<p class="src">Verification sources: <a href="https://publicationethics.org/guidance" rel="noopener">COPE guidance</a>; the <a href="https://retractionwatch.com/the-retraction-watch-hijacked-journal-checker/" rel="noopener">Retraction Watch Hijacked Journal Checker</a>; the UGC notices dated <a href="https://www.ugc.gov.in/pdfnews/9678711_PUBLIC-NOTICE-CARE.pdf" rel="noopener">11 February 2025</a> and <a href="https://www.ugc.gov.in/pdfnews/6124898_Public-Notice-CARE-Journals.pdf" rel="noopener">16 July 2025</a>; and <a href="https://thinkchecksubmit.org/" rel="noopener">Think. Check. Submit.</a> Accessed 4 August 2026. This is general information, not legal advice; consult the relevant institution and a qualified professional where rights, misconduct or republication consequences are material.</p>'),
          ]:
              replace_once(path, old, new)

          # Older UGC verification guide: align with the official final notice.
          path = 'insights/verify-a-journal-2026/index.html'
          for old, new in [
              ('<li><a href="#three-checks">The three checks that actually settle the question</a></li>', '<li><a href="#three-checks">Three checks that structure the decision</a></li>'),
              ('<h2 id="three-checks">The three checks that actually settle the question</h2>', '<h2 id="three-checks">Three checks that structure the decision</h2>'),
              ('millions of Indian scholars', 'Indian scholars'),
              ('at its 595th meeting on <strong>24 June 2025</strong>', 'at its 591st meeting on <strong>24 June 2025</strong>'),
              ('eight broad categories, with the sub-parameter count reported inconsistently as 35 or 36 across official materials. The official annexure should therefore remain the controlling reference.', 'eight broad criteria and 35 numbered sub-parameters. The earlier February draft contained 36; the final 16 July 2025 annexure is the controlling reference.'),
              ('It is also far more reliable, because it cannot be gamed by a journal that bought its way onto a list.', 'It also reduces dependence on a single lookup that may become stale, be misunderstood or fail to establish the identity of the website being assessed.'),
              ('Strip the problem to its essentials and almost every legitimate journal clears three independent, free, public checks.', 'A practical journal review can begin with three independent, free, public checks.'),
              ('does the journal have a real, traceable publication history — a run of articles with registered DOIs through Crossref, editors who exist and are reachable, an ISSN that resolves?', 'does the journal have a traceable publication history — persistent identifiers and DOI records verifiable through the relevant registration agency, editors whose involvement can be corroborated, and an ISSN record that matches the title and publisher?'),
              ('A tool that shows you the public evidence and teaches you to read it cannot be silenced, because it is only ever pointing at records that already exist in the open.', 'A source-labelled tool is more auditable and resilient than a verdict list because each result can be checked against the underlying public record.'),
              ('In the post-CARE era, that discipline — not a lookup — is what protects your record.', 'In the post-CARE era, that discipline supports a more defensible, documented decision than a single lookup.'),
              ('<p class="src">Sources and further reading: UGC notice discontinuing the CARE list (February 2025) and the Suggestive Parameters for Peer-Reviewed Journals approved at the UGC\'s 595th meeting (24 June 2025); the closure of Beall\'s List (2017) and its documentation on Wikipedia; Cabells Predatory Reports; and Think. Check. Submit. Journal-legitimacy signals in this piece are drawn from these public sources and from the author\'s own peer-review practice across Scopus and Web of Science journals.</p>', '<p class="src">Primary policy sources: the UGC notices dated <a href="https://www.ugc.gov.in/pdfnews/9678711_PUBLIC-NOTICE-CARE.pdf" rel="noopener">11 February 2025</a> and <a href="https://www.ugc.gov.in/pdfnews/6124898_Public-Notice-CARE-Journals.pdf" rel="noopener">16 July 2025</a>. The final notice records approval at the Commission’s 591st meeting on 24 June 2025 and contains 35 numbered sub-parameters; the draft contained 36. Supporting due-diligence guidance: <a href="https://thinkchecksubmit.org/" rel="noopener">Think. Check. Submit.</a> Accessed 4 August 2026. Confirm current journal status and institutional requirements at the relevant primary source.</p>'),
          ]:
              replace_once(path, old, new)

          # Scopus publication guide.
          path = 'insights/scopus-publication-guide/index.html'
          for old, new in [
              ('<p class="lede">In the post-CARE landscape, genuine Scopus indexing has become the benchmark that matters. This is the honest, end-to-end guide — how to choose and verify a journal, read its metrics, understand the costs and timelines, and submit ethically, with no shortcuts and no guarantees.</p>', '<p class="lede">In the post-CARE landscape, current Scopus coverage is one widely used, independently checkable signal — not a universal benchmark or guarantee. This guide covers journal fit, source verification, metrics, costs, timelines and ethical submission.</p>'),
              ('indexing in a recognised international database has become the clearest, most defensible signal of a journal\'s standing — and <strong>Scopus</strong>, Elsevier\'s abstract and citation database, is the one most Indian scholars are asked about.', 'indexing in a recognised international database is one independently checkable signal of a journal’s standing — and <strong>Scopus</strong>, Elsevier’s abstract and citation database, is commonly requested by Indian institutions and researchers.'),
              ('Its authority comes from that selectivity: a journal cannot simply declare itself "in Scopus," it has to be evaluated and admitted, and it can be discontinued if standards slip.', 'Its value as evidence comes from published selection and re-evaluation processes: a journal’s own claim is not enough, and current coverage must be confirmed in the source record.'),
              ('for most purposes either recognised index is a strong benchmark.', 'either database may be a relevant signal, depending on the field and the institution’s current policy.'),
              ('Scope-matching is not a formality — a mismatched submission wastes months and a desk rejection, while a well-matched one is the single biggest lever on your odds of acceptance.', 'Scope-matching is not a formality: a mismatch can lead to desk rejection, while a well-matched venue is an important controllable factor. It does not assure acceptance.'),
              ('The corollary is one of the most reliable red flags in all of publishing: <strong>any journal promising publication in days or a couple of weeks is telling you its peer review is not real</strong>. Speed, in this domain, is almost never a feature — it is a confession.', 'An unusually short guaranteed timeline is a material warning that requires verification of the journal’s review process. Legitimate turnaround varies by field, article type and editorial model, so speed alone is not proof of misconduct; hidden fees, implausible guarantees and absent review evidence make the concern stronger.'),
              ('Almost every avoidable failure I see comes from choosing a journal badly', 'Many avoidable failures I see begin with choosing a journal badly'),
              ('Any journal that promises publication in days or a few weeks is signalling that its peer review is not genuine, which is a warning sign rather than a convenience.', 'A guaranteed publication promise measured in days or a few weeks is a warning that should trigger verification of the review process, fees and editorial record; speed alone is not a conclusive finding.'),
              ('<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · 12 July 2026 · 14 min read</p>', '<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · Updated 4 August 2026 · 14 min read</p>'),
              ('<p class="src">Sources and further reading: the Scopus sources page and the freely downloadable Scopus source list, including its discontinued-titles information, and Scopus metrics documentation for CiteScore (Elsevier); SCImago Journal Rank (SJR) and Source Normalized Impact per Paper (SNIP); the Web of Science Master Journal List and Journal Citation Reports (Clarivate); the UGC public notices on the discontinuation of the UGC-CARE list (effective 11 February 2025) and Suggestive Parameters (16 July 2025); the Committee on Publication Ethics (COPE) on simultaneous submission and publication ethics; and Think. Check. Submit. Method and definitions are drawn from these public sources and, where noted, from the author\'s own peer-review practice across Scopus and Web of Science journals. Compiled with care; verify any decisive detail at the primary source on the day you act.</p>', '<p class="src">Verification sources: <a href="https://www.scopus.com/sources" rel="noopener">Scopus Sources</a>, <a href="https://www.elsevier.com/products/scopus/content/content-policy-and-selection" rel="noopener">Scopus content policy</a> and <a href="https://www.elsevier.com/en-gb/products/scopus/metrics/citescore" rel="noopener">CiteScore documentation</a>; <a href="https://www.scimagojr.com/" rel="noopener">SCImago Journal Rank</a>; the <a href="https://mjl.clarivate.com/home" rel="noopener">Web of Science Master Journal List</a>; UGC notices dated <a href="https://www.ugc.gov.in/pdfnews/9678711_PUBLIC-NOTICE-CARE.pdf" rel="noopener">11 February 2025</a> and <a href="https://www.ugc.gov.in/pdfnews/6124898_Public-Notice-CARE-Journals.pdf" rel="noopener">16 July 2025</a>; <a href="https://publicationethics.org/guidance" rel="noopener">COPE guidance</a>; and <a href="https://thinkchecksubmit.org/" rel="noopener">Think. Check. Submit.</a> Accessed 4 August 2026. Coverage, metrics, fees and institutional rules can change.</p>'),
          ]:
              replace_once(path, old, new)

          # Scopus / Web of Science / ABDC comparison.
          path = 'insights/scopus-wos-abdc-compared/index.html'
          for old, new in [
              ('<p class="lede">Three names get quoted interchangeably as if they were the same badge of quality. They are not. One is a broad citation index, one is a selective one, and one is a discipline-specific rating list. Knowing which is which — and which your institution actually cares about — saves a lot of wasted effort.</p>', '<p class="lede">Three names are often quoted as though they were the same badge. They are not: Scopus and Web of Science are citation databases with different coverage and selection systems, while ABDC is a discipline-specific journal rating list. The relevant source depends on the field and the institution’s written policy.</p>'),
              ('For most Indian researchers in 2026 it is the benchmark asked about most often.', 'For many Indian researchers it is a commonly requested indexing signal, but institutional requirements vary.'),
              ('In practice Scopus and Web of Science are the two general-purpose benchmarks, and being genuinely indexed in either is a strong signal; many strong journals are in both.', 'In practice Scopus and Web of Science are widely used general-purpose sources. Current coverage in either is a positive signal, not a guarantee of journal quality or institutional acceptance.'),
              ('As a general benchmark of legitimacy, genuine Scopus or Web of Science indexing is what most committees can verify and trust.', 'As a general evidence source, current Scopus or Web of Science coverage is independently checkable, but the institution must define how it uses that evidence.'),
              ('Neither is simply better — they are the two major citation indexes, both selective and both widely trusted.', 'Neither is simply better. Both publish selection policies and are widely used, but they differ in coverage and institutional relevance.'),
              ('<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · 12 July 2026 · 8 min read</p>', '<p class="byline">By <a href="../../people/#jaskirat-singh">Dr. Jaskirat Singh</a> · Updated 4 August 2026 · 8 min read</p>'),
              ('<p class="src">Sources and further reading: Scopus (Elsevier) source and coverage documentation; the Web of Science Master Journal List and Core Collection documentation (Clarivate); and the Australian Business Deans Council (ABDC) Journal Quality List. Definitions are drawn from these public sources and, where noted, from the author\'s own peer-review practice. Compiled with care; confirm a journal\'s current status at the relevant source.</p>', '<p class="src">Verification sources: <a href="https://www.scopus.com/sources" rel="noopener">Scopus Sources</a> and <a href="https://www.elsevier.com/products/scopus/content/content-policy-and-selection" rel="noopener">Elsevier’s content policy</a>; the <a href="https://mjl.clarivate.com/home" rel="noopener">Web of Science Master Journal List</a>; and the <a href="https://abdc.edu.au/abdc-journal-quality-list/" rel="noopener">ABDC Journal Quality List</a>. Accessed 4 August 2026. Confirm the current record and the institution’s written rule before relying on any database or list.</p>'),
          ]:
