name: GJ-018E exact contrast repair

on:
  push:
    branches:
      - agent/decision-workflows-public-beta

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/decision-workflows-public-beta
          fetch-depth: 0
      - name: Apply exact fail-closed repair
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/decision-workflows.css')
          css = css_path.read_text()
          old_css = '.decision-tool__governance{margin-top:clamp(3rem,7vw,6rem);background:var(--navy);color:#fff}.decision-tool__governance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem}.decision-tool__governance h2{color:inherit}.decision-tool__governance p{color:color-mix(in srgb,#fff 80%,transparent)}.tool-page main>section.decision-tool__governance{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-d) 70%);color:#fff;border-top:3px solid var(--gold)}.tool-page main>section.decision-tool__governance::before{background:radial-gradient(70% 70% at 82% 20%,rgba(176,138,53,.12),transparent 72%);opacity:1}.tool-page main>section.decision-tool__governance>.wrap{position:relative;z-index:1}.tool-page main>section.decision-tool__governance .eyebrow{color:var(--gold-l)}.tool-page main>section.decision-tool__governance .eyebrow::before{background:var(--gold-l)}'
          new_css = '.decision-tool__governance{margin-top:clamp(3rem,7vw,6rem);color:#fff}.decision-tool__governance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem}body.tool-page main#main>section.decision-tool__governance{isolation:isolate;overflow:hidden;background-color:#041a37!important;background-image:none!important;color:#fff!important;border-top:3px solid var(--gold)}body.tool-page main#main>section.decision-tool__governance::before{z-index:-1;background-color:transparent!important;background-image:radial-gradient(70% 70% at 82% 20%,rgba(176,138,53,.16),transparent 72%)!important;opacity:1}body.tool-page main#main>section.decision-tool__governance>.wrap{position:relative;z-index:1}body.tool-page main#main>section.decision-tool__governance h2{color:#fff!important}body.tool-page main#main>section.decision-tool__governance p{color:#d8e1ec!important}body.tool-page main#main>section.decision-tool__governance .eyebrow{color:#d9b968!important}body.tool-page main#main>section.decision-tool__governance .eyebrow::before{background:#d9b968!important}'
          if css.count(old_css) != 1:
              raise SystemExit('Expected exactly one governance CSS block')
          css_path.write_text(css.replace(old_css, new_css))

          test_path = Path('tests/visual/evidence-loop-capture.mjs')
          test = test_path.read_text()
          helper_anchor = '''async function assertAccessible(page, label) {
            await page.addScriptTag({ content: axeSource });
            const violations = await page.evaluate(async () => {
              const result = await globalThis.axe.run(document, {
                runOnly: {
                  type: "tag",
                  values: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22a", "wcag22aa"],
                },
                resultTypes: ["violations"],
              });
              return result.violations.map((violation) => ({
                id: violation.id,
                impact: violation.impact,
                nodes: violation.nodes.length,
              }));
            });
            const blocking = violations.filter((violation) => blockingImpacts.has(violation.impact));
            assert.deepEqual(blocking, [], `${label} must have no serious or critical axe violations`);
          }
          '''
          helper_anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper_anchor.splitlines()) + '\n'
          helper = '''
          async function assertGovernanceSurface(page, label) {
            const governance = page.locator(".decision-tool__governance");
            assert.equal(await governance.count(), 1, `${label} must expose one decision-boundary panel`);
            const styles = await governance.evaluate((section) => {
              const heading = section.querySelector("h2");
              const paragraph = section.querySelector("p");
              return {
                backgroundColor: getComputedStyle(section).backgroundColor,
                headingColor: getComputedStyle(heading).color,
                paragraphColor: getComputedStyle(paragraph).color,
              };
            });
            assert.deepEqual(styles, {
              backgroundColor: "rgb(4, 26, 55)",
              headingColor: "rgb(255, 255, 255)",
              paragraphColor: "rgb(216, 225, 236)",
            }, `${label} governance panel must preserve its explicit dark-surface contrast contract`);
          }
          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n'
          if test.count(helper_anchor) != 1:
              raise SystemExit('Expected exactly one accessibility helper anchor')
          test = test.replace(helper_anchor, helper_anchor + helper)
          call_anchor = '      await assertAccessible(page, `${viewport.name} ${workflow.id} initial`);\n'
          if test.count(call_anchor) != 1:
              raise SystemExit('Expected exactly one initial accessibility call anchor')
          test = test.replace(call_anchor, call_anchor + '      await assertGovernanceSurface(page, `${viewport.name} ${workflow.id} initial`);\n')
          test_path.write_text(test)
          PY
          rm .github/workflows/gj018e-contrast-repair.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/decision-workflows.css tests/visual/evidence-loop-capture.mjs .github/workflows/gj018e-contrast-repair.yml
          git commit -m "GJ-018E: enforce decision-boundary contrast contract"
          git push origin HEAD:agent/decision-workflows-public-beta
