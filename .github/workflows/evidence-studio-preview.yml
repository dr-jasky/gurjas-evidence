name: Evidence Studio preview (non-deploying)

# A design-only inspection route. It does NOT replace or weaken Site quality.
on:
  push:
    branches: [design/evidence-studio-home-20261015]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.4.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source syntax before rendering
        run: |
          python -m py_compile scripts/*.py
          node --check assets/evidence-studio-home.js
          node --check tests/visual/studio-preview.mjs
      - name: Build production-equivalent static pages (not deployment)
        run: |
          python scripts/build_site.py --clean
          python scripts/check_build.py
          node tests/conversion/product-front-door.spec.mjs
          node tests/navigation/sitewide-navigation.spec.mjs
      - name: Install preview browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Render and exercise the design
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory _site >/tmp/studio-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 10 --retry-delay 1 http://127.0.0.1:8000/ > /dev/null
          node tests/visual/studio-preview.mjs
      - name: Upload desktop, tablet and mobile preview (review only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gurjas-evidence-studio-preview
          path: visual-review/evidence-studio
          if-no-files-found: warn
          retention-days: 14
