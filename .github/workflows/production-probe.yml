name: Verify live PR 80 routes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live routes
        shell: bash
        run: |
          set -euo pipefail

          check_route() {
            route="$1"
            marker="$2"
            url="https://gurjas.org${route}"
            headers="$(mktemp)"

            echo "Checking ${url}"
            body="$(curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 10 --retry-all-errors \
              --max-time 30 --dump-header "$headers" "$url")"

            test -n "$body"
            grep -qi '<main' <<<"$body"
            grep -Fqi "$marker" <<<"$body"
            grep -Fq "<link rel=\"canonical\" href=\"https://gurjas.org${route}\">" <<<"$body"

            if grep -qi '^x-robots-tag:.*noindex' "$headers"; then
              echo "Unexpected noindex header on ${url}"
              exit 1
            fi
          }

          check_route "/knowledge/" "Research Knowledge Hub"
          check_route "/knowledge/research-integrity/" "Research integrity and scholarly communication"
          check_route "/knowledge/research-design/" "Research design and methods"
          check_route "/knowledge/institutional-pathways/" "Start with the evidence gap"
          check_route "/resources/journal-assessment-checklist/" "Journal assessment checklist"
          check_route "/resources/research-question-canvas/" "Research question canvas"
