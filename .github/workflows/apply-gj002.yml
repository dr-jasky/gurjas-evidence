name: Apply GJ-002 citation patch

on:
  push:
    branches:
      - agent/claim-level-primary-citations

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/claim-level-primary-citations
          fetch-depth: 0

      - name: Apply audited article and test changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          article_path = Path("insights/how-to-identify-a-predatory-journal/index.html")
          article = article_path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global article
              count = article.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one article match, found {count}: {old[:100]!r}")
              article = article.replace(old, new, 1)

          replace_once(
              '        <li><a href="#faq">Frequently asked questions</a></li>\n',
              '        <li><a href="#faq">Frequently asked questions</a></li>\n        <li><a href="#sources">Sources and verification dates</a></li>\n',
          )
          replace_once(' · 14 min read</p>', ' · 16 min read</p>')
          replace_once(
              'The independent Retraction Watch Hijacked Journal Checker maintains a public register of documented cases, which had grown past 450 entries by mid-2026.',
              'The independent Retraction Watch Hijacked Journal Checker maintains a public register of documented cases, which had grown past 450 entries by mid-2026.<sup><a href="#source-retraction-watch" aria-label="Source 9">[9]</a></sup>',
          )
          replace_once(
              'The historical list of <strong>1,474</strong> titles still sits on the UGC website, but the Commission has been unusually plain that inclusion there no longer implies validation or endorsement.</p>',
              'The historical list of <strong>1,474</strong> titles still sits on the UGC website, but the Commission has been unusually plain that inclusion there no longer implies validation or endorsement.<sup><a href="#source-ugc" aria-label="Source 1">[1]</a></sup></p>',
          )
          replace_once(
              'None is a universal benchmark or a guarantee of journal quality. The decisive habit',
              'None is a universal benchmark or a guarantee of journal quality.<sup><a href="#source-scopus" aria-label="Source 2">[2]</a></sup><sup><a href="#source-wos" aria-label="Source 3">[3]</a></sup><sup><a href="#source-doaj" aria-label="Source 4">[4]</a></sup> The decisive habit',
          )
          replace_once(
              'First, indexing is not permanent: Scopus and Web of Science continuously re-evaluate titles and <strong>discontinue</strong> those that stop meeting their criteria, so confirm the status is currently <em>active</em>, and cross-check the freely downloadable Scopus discontinued-sources list before you submit',
              'First, indexing is not permanent: Scopus and Web of Science continuously re-evaluate titles and <strong>discontinue</strong> those that stop meeting their criteria, so confirm the status is currently <em>active</em>, and cross-check the freely downloadable Scopus discontinued-sources list before you submit<sup><a href="#source-scopus" aria-label="Source 2">[2]</a></sup><sup><a href="#source-wos" aria-label="Source 3">[3]</a></sup>',
          )
          replace_once(
              '<strong>DOIs:</strong> legitimate articles are registered with a Digital Object Identifier through Crossref, and a genuine DOI always begins with <code>10.</code> and resolves to the correct article at the correct publisher; a journal whose "DOIs" do not resolve, or resolve to a different site than the one soliciting you, is a serious warning. <strong>ISSN:</strong> the number should resolve on the public ISSN Portal to the title and publisher you expect.',
              '<strong>DOIs:</strong> many scholarly articles register Digital Object Identifiers through Crossref. A DOI registered there should resolve to the authoritative publisher location; a journal whose claimed DOI does not resolve, or resolves to a different site than the one soliciting you, presents a material identity gap.<sup><a href="#source-crossref" aria-label="Source 5">[5]</a></sup> <strong>ISSN:</strong> the number should resolve on the public ISSN Portal to the title and publisher you expect.<sup><a href="#source-issn" aria-label="Source 6">[6]</a></sup>',
          )
          replace_once(
              'a journal advertising "UGC-CARE approved" status in 2026 is, by definition, misrepresenting itself, because there is no such current status to hold.</p>',
              'a journal advertising "UGC-CARE approved" status in 2026 is making a claim that cannot be verified against a current UGC-CARE list, because that list is no longer maintained.<sup><a href="#source-ugc" aria-label="Source 1">[1]</a></sup> Think. Check. Submit. provides a complementary publisher and journal checklist for these conduct signals.<sup><a href="#source-think-check-submit" aria-label="Source 10">[10]</a></sup></p>',
          )
          replace_once(
              'But red flags are cumulative, and three or four together, against a title that also fails the indexing and provenance checks, is a clear signal to walk away.',
              'But red flags are cumulative. When conduct concerns align with indexing or provenance gaps, record the title as unresolved or as presenting material integrity concerns until the primary records are reconciled; no fixed number of warning signs establishes misconduct.',
          )
          replace_once(
              'And consult the Retraction Watch Hijacked Journal Checker, which exists precisely to document known impersonations.',
              'And consult the Retraction Watch Hijacked Journal Checker, which documents known and suspected impersonations and publishes its inclusion methods.<sup><a href="#source-retraction-watch" aria-label="Source 9">[9]</a></sup>',
          )
          replace_once(
              'the <strong>Journal Impact Factor</strong>, published by Clarivate from Web of Science data, and <strong>CiteScore</strong>, published by Elsevier from Scopus data.',
              'the <strong>Journal Impact Factor</strong>, published in Clarivate Journal Citation Reports, and <strong>CiteScore</strong>, published by Elsevier from Scopus data.<sup><a href="#source-jcr" aria-label="Source 11">[11]</a></sup><sup><a href="#source-citescore" aria-label="Source 12">[12]</a></sup>',
          )
          replace_once(
              'Real memberships are a positive signal; unverifiable ones are a red flag wearing a badge.</p>',
              'Real memberships are a positive signal; unverifiable ones are a red flag wearing a badge.<sup><a href="#source-transparency-principles" aria-label="Source 7">[7]</a></sup><sup><a href="#source-oaspa-members" aria-label="Source 8">[8]</a></sup></p>',
          )
          replace_once(
              'Jeffrey Beall\'s widely cited list of predatory publishers was <strong>taken offline entirely in January 2017</strong>, and the anonymous archives that succeeded it carry no institutional accountability. Cabells operates a serious commercial database of questionable journals, but it sits behind an institutional subscription most individual scholars in India will never see. And the UGC-CARE list, as we have seen, has itself been discontinued.',
              'Past lists have disappeared, moved behind subscriptions or survived only as anonymous archives with no institutional accountability. The UGC-CARE list, as we have seen, has itself been discontinued.<sup><a href="#source-ugc" aria-label="Source 1">[1]</a></sup>',
          )
          replace_once(
              'Always confirm current, active status directly at the official source on the day you submit, and check the Scopus discontinued-sources list.</p>',
              'Always confirm current, active status directly at the official source on the day you submit, and check the Scopus discontinued-sources list.<sup><a href="#source-scopus" aria-label="Source 2">[2]</a></sup><sup><a href="#source-wos" aria-label="Source 3">[3]</a></sup></p>',
          )
          replace_once(
              'Treat DOAJ listing as one signal among several — indexing, a traceable publication history and transparent conduct — rather than a single verdict.</p>',
              'Treat DOAJ listing as one signal among several — indexing, a traceable publication history and transparent conduct — rather than a single verdict.<sup><a href="#source-doaj" aria-label="Source 4">[4]</a></sup></p>',
          )
          replace_once(
              'The Retraction Watch Hijacked Journal Checker maintains a public register of documented cases to check against.</p>',
              'The Retraction Watch Hijacked Journal Checker maintains a public register of documented cases to check against.<sup><a href="#source-retraction-watch" aria-label="Source 9">[9]</a></sup></p>',
          )
          replace_once(
              'A frozen reference list of 1,474 titles remains online for reference only and does not imply endorsement, so verification now falls to the individual researcher and institution.</p>',
              'A frozen reference list of 1,474 titles remains online for reference only and does not imply endorsement, so verification now falls to the individual researcher and institution.<sup><a href="#source-ugc" aria-label="Source 1">[1]</a></sup></p>',
          )

          old_sources = '    <p class="src">Sources and further reading: UGC notice discontinuing the CARE list (effective 11 February 2025) and the Suggestive Parameters for Peer-Reviewed Journals approved at the UGC\'s 595th meeting (24 June 2025) and notified 16 July 2025; the Scopus source list and discontinued-sources list (Elsevier); the Web of Science Master Journal List (Clarivate); the Directory of Open Access Journals (DOAJ); the Committee on Publication Ethics (COPE) and OASPA member directories; Crossref and the ISSN Portal; the Retraction Watch Hijacked Journal Checker; the closure of Beall\'s List (January 2017); and Think. Check. Submit. Figures and dates are drawn from these public sources and, where noted, from the author\'s own peer-review practice across Scopus and Web of Science journals. Compiled with care; where a date or status is decisive for your decision, confirm it at the primary source on the day you act.</p>'
          new_sources = '''    <h2 id="sources">Sources and verification dates</h2>
              <div class="src">
                <p>References are linked at the claim they support. All online records below were accessed on <strong>4 August 2026</strong>. Journal coverage, membership and registry status can change; recheck the relevant primary record on the day you act.</p>
                <ol>
                  <li id="source-ugc"><a href="https://ugccare.unipune.ac.in/Apps1/Home/Index" rel="noopener">University Grants Commission, Consortium for Academic and Research Ethics</a> — official notices and the reference-only status of the former UGC-CARE list. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-scopus"><a href="https://www.elsevier.com/products/scopus/content/content-policy-and-selection" rel="noopener">Elsevier, Scopus content policy and selection</a> — title selection, re-evaluation and discontinuation policy. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-wos"><a href="https://mjl.clarivate.com/home?PC=B" rel="noopener">Clarivate, Web of Science Master Journal List</a> — official coverage lookup. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-doaj"><a href="https://doaj.org/apply/guide/" rel="noopener">Directory of Open Access Journals, Guide to applying</a> — published inclusion and transparency criteria. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-crossref"><a href="https://www.crossref.org/documentation/register-maintain-records/verify-your-registration/" rel="noopener">Crossref, Verify your registration</a> — DOI registration and resolution checks. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-issn"><a href="https://portal.issn.org/" rel="noopener">ISSN International Centre, ISSN Portal</a> — official serial-identifier lookup. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-transparency-principles"><a href="https://publicationethics.org/resources/guidelines-new/principles-transparency-and-best-practice-scholarly-publishing" rel="noopener">COPE, DOAJ, OASPA and WAME, Principles of Transparency and Best Practice in Scholarly Publishing</a>. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-oaspa-members"><a href="https://www.oaspa.org/membership/current-members/" rel="noopener">Open Access Scholarly Publishing Association, Current Members</a> — membership verification directory. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-retraction-watch"><a href="https://retractionwatch.com/the-retraction-watch-hijacked-journal-checker/" rel="noopener">Retraction Watch, Hijacked Journal Checker</a> and <a href="https://retractionwatch.com/the-retraction-watch-hijacked-journal-checker/methods/" rel="noopener">published methods</a>. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-think-check-submit"><a href="https://thinkchecksubmit.org/" rel="noopener">Think. Check. Submit.</a> — publisher and journal due-diligence checklist. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-jcr"><a href="https://clarivate.com/academia-government/scientific-and-academic-research/research-funding-analytics/journal-citation-reports/" rel="noopener">Clarivate, Journal Citation Reports</a> — source of the Journal Impact Factor. <span>Accessed 4 August 2026.</span></li>
                  <li id="source-citescore"><a href="https://www.elsevier.com/en-gb/products/scopus/metrics/citescore" rel="noopener">Elsevier, Scopus CiteScore</a> — methodology and freely available title metrics. <span>Accessed 4 August 2026.</span></li>
                </ol>
              </div>'''
          replace_once(old_sources, new_sources)
          article_path.write_text(article, encoding="utf-8")

          test_path = Path("tests/governance/claim-level-citations.spec.mjs")
          test_path.write_text('''import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const failures = [];

          function check(condition, message) {
            console.log(`${condition ? "PASS" : "FAIL"} — ${message}`);
            if (!condition) failures.push(message);
          }

          const flagshipPath = path.join(root, "insights/how-to-identify-a-predatory-journal/index.html");
          const flagship = fs.readFileSync(flagshipPath, "utf8");
          const sourceIds = [
            "source-ugc", "source-scopus", "source-wos", "source-doaj",
            "source-crossref", "source-issn", "source-transparency-principles",
            "source-oaspa-members", "source-retraction-watch",
            "source-think-check-submit", "source-jcr", "source-citescore",
          ];

          check((flagship.match(/id="sources"/g) || []).length === 1, "flagship guide has one stable sources section");
          check(!/Sources and further reading:/i.test(flagship), "generic unlinked source paragraph has been removed");
          check((flagship.match(/Accessed 4 August 2026\./g) || []).length === sourceIds.length, "every source records the retrieval date");
          check(!/three or four together/i.test(flagship), "flagship guide contains no fixed red-flag count verdict");

          for (const id of sourceIds) {
            check((flagship.match(new RegExp(`id="${id}"`, "g")) || []).length === 1, `${id} has one reference-list target`);
            check(flagship.includes(`href="#${id}"`), `${id} is cited at a supporting claim`);
          }

          const sourceLinks = [...flagship.matchAll(/<li id="source-[^"]+">([\s\S]*?)<\/li>/g)];
          check(sourceLinks.length === sourceIds.length, "source register contains the governed twelve official records");
          for (const [, item] of sourceLinks) {
            const externalAnchors = [...item.matchAll(/<a href="https:\/\/[^\"]+"([^>]*)>/g)];
            check(externalAnchors.length >= 1, "each source entry contains an external primary-record link");
            check(externalAnchors.every(([, attrs]) => /rel="noopener"/.test(attrs)), "each source link preserves opener isolation");
          }

          const claimRefs = [...flagship.matchAll(/href="#(source-[^"]+)"/g)].map((match) => match[1]);
          const missingTargets = claimRefs.filter((id) => !flagship.includes(`id="${id}"`));
          check(missingTargets.length === 0, "every claim-level citation resolves to a local source target");
          check(claimRefs.length >= 20, "load-bearing claims carry repeated local source markers");

          const requiredOfficialHosts = [
            "ugccare.unipune.ac.in", "www.elsevier.com", "mjl.clarivate.com",
            "doaj.org", "www.crossref.org", "portal.issn.org",
            "publicationethics.org", "www.oaspa.org", "retractionwatch.com",
            "thinkchecksubmit.org", "clarivate.com",
          ];
          for (const host of requiredOfficialHosts) {
            check(flagship.includes(`https://${host}`), `source register includes ${host}`);
          }

          if (failures.length) {
            console.error(`\n${failures.length} claim-level citation check(s) failed.`);
            process.exitCode = 1;
          } else {
            console.log("\nAll claim-level citation checks passed.");
          }
          ''', encoding="utf-8")

          package_path = Path("package.json")
          package = package_path.read_text(encoding="utf-8")
          analytics_line = '    "test:analytics": "node tests/analytics/events.spec.mjs",\n'
          if package.count(analytics_line) != 1:
              raise SystemExit("Could not register test:citations")
          package = package.replace(
              analytics_line,
              analytics_line + '    "test:citations": "node tests/governance/claim-level-citations.spec.mjs",\n',
              1,
          )
          tools_old = 'node tests/governance/journal-integrity-language.spec.mjs && node tests/security/contact-form.spec.mjs'
          tools_new = 'node tests/governance/journal-integrity-language.spec.mjs && node tests/governance/claim-level-citations.spec.mjs && node tests/security/contact-form.spec.mjs'
          if package.count(tools_old) != 1:
              raise SystemExit("Could not register citation guard in test:tools")
          package = package.replace(tools_old, tools_new, 1)
          package_path.write_text(package, encoding="utf-8")

          workflow = Path(".github/workflows/apply-gj002.yml")
          workflow.unlink()
          PY

          node tests/governance/claim-level-citations.spec.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights/how-to-identify-a-predatory-journal/index.html tests/governance/claim-level-citations.spec.mjs package.json .github/workflows/apply-gj002.yml
          git commit -m "GJ-002: Add claim-level primary citations"
          git push origin HEAD:agent/claim-level-primary-citations
