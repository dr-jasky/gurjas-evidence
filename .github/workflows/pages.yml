name: Deploy generated site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check assets/decision-tools.js
          node --check tests/decision-tools/decision-record.spec.mjs

      - name: Check Python syntax
        run: python -m py_compile scripts/*.py

      - name: Run source integrity checks
        run: python scripts/quality-check.py

      - name: Run governed decision-framework fixtures
        run: node tests/decision-tools/decision-record.spec.mjs

      - name: Build static site
        run: python scripts/build_site.py --clean

      - name: Publish and validate security contact records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/.well-known
          install -m 0644 security.txt _site/security.txt
          install -m 0644 security.txt _site/.well-known/security.txt
          cmp --silent security.txt _site/security.txt
          cmp --silent security.txt _site/.well-known/security.txt
          grep -Fxq 'Canonical: https://gurjas.org/.well-known/security.txt' _site/.well-known/security.txt
          grep -Fxq 'Contact: mailto:support@gurjas.org' _site/.well-known/security.txt

      - name: Check generated routes, canonicals and local links
        run: python scripts/check_build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out deployed source commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The delegated verifier must retain these governed production contracts:
      # "/services/research-integrity/"
      # "/services/naac-evidence-readiness/"
      # "/services/impact-evaluation/"
      # "/services/research-methods/"
      # "Unexpected noindex header"
      # "Sitemap: https://gurjas.org/sitemap.xml"
      - name: Verify exact deployed release and priority routes
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python scripts/verify_production.py \
            --base-url "$SITE_URL" \
            --expected-sha "$EXPECTED_SHA" \
            --attempts 8 \
            --delay 15 \
            --report production-audit.json

      - name: Verify deployed security contact records
        shell: bash
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 15 --retry-all-errors \
            "${SITE_URL%/}/security.txt" > deployed-security-root.txt
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 15 --retry-all-errors \
            "${SITE_URL%/}/.well-known/security.txt" > deployed-security-well-known.txt
          cmp --silent security.txt deployed-security-root.txt
          cmp --silent security.txt deployed-security-well-known.txt
          grep -Fxq 'Canonical: https://gurjas.org/.well-known/security.txt' deployed-security-well-known.txt

      - name: Upload deployment audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gurjas-deployment-audit
          path: |
            production-audit.json
            deployed-security-root.txt
            deployed-security-well-known.txt
          if-no-files-found: error
          retention-days: 30
